<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE BLIND WAY — Official Movie Page</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#f5f5f5;font-family:Arial,sans-serif}
header,section,footer{padding:24px 7%;border-bottom:1px solid #282828}
.brand{font-family:Georgia,serif;letter-spacing:3px;color:#ff777b}
.hero{min-height:55vh;display:flex;align-items:center;justify-content:center;text-align:center}
main{max-width:800px;margin:auto}
h1{font-family:Georgia,serif;font-size:clamp(34px,7vw,58px)}
p{line-height:1.7;color:#ccc}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:7px;font-size:16px}
input{background:#181818;color:white;border:1px solid #555}
button{background:#ff777b;color:#111;border:0;font-weight:bold}
button:disabled{opacity:.5}
.note{font-size:13px;color:#aaa}
#status{overflow-wrap:anywhere}
iframe{width:100%;aspect-ratio:16/9;border:0}
</style>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>
<body>
<header><div class="brand">MAHENDRAN FILMS</div></header>
<main>
<section class="hero">
<div>
<p>AN ORIGINAL TAMIL THRILLER</p>
<h1>THE BLIND WAY</h1>
<p>A Mahendran Films Original</p>
<p>Full Movie Access — ₹49</p>
</div>
</section>
<section>
<h2>Watch the Movie</h2>
<p>Complete the payment to unlock secure movie playback.</p>
<form id="payForm">
<label for="phone">Mobile number</label>
<input id="phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required>
<label for="email">Email (optional)</label>
<input id="email" type="email" placeholder="Email address">
<button id="payBtn" type="submit">Pay ₹49 and Watch</button>
</form>
<p id="status" role="status"></p>
<div id="player"></div>
<p class="note">Secure playback is available after the server confirms successful payment.</p>
</section>
</main>
<footer><p>© Mahendran Films · THE BLIND WAY</p></footer>
<script>
const cashfree = Cashfree({mode:"production"});
const form = document.getElementById("payForm");
const button = document.getElementById("payBtn");
const statusBox = document.getElementById("status");
const player = document.getElementById("player");

async function unlockMovie(orderId){
  statusBox.textContent = "Verifying payment securely…";
  const response = await fetch("/api/watch-movie", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({order_id:orderId})
  });
  const data = await response.json();
  if(!response.ok) throw new Error(data.error || "Payment verification failed.");
  player.innerHTML = "";
  const frame = document.createElement("iframe");
  frame.src = "https://player.vdocipher.com/v2/?otp=" +
    encodeURIComponent(data.otp) + "&playbackInfo=" +
    encodeURIComponent(data.playbackInfo);
  frame.allow = "encrypted-media; autoplay; fullscreen";
  frame.allowFullscreen = true;
  player.appendChild(frame);
  statusBox.textContent = "Payment verified. Enjoy the movie.";
}

(async function checkReturn(){
  const params = new URLSearchParams(location.search);
  const orderId = params.get("order_id");
  if(orderId){
    try { await unlockMovie(orderId); }
    catch(error){ statusBox.textContent = error.message; }
  }
})();

form.addEventListener("submit", async (event)=>{
  event.preventDefault();
  button.disabled = true;
  statusBox.textContent = "Preparing secure payment…";
  try{
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const response = await fetch("/api/create-order", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({phone,email})
    });
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "Could not create payment.");
    if(!data.payment_session_id || !data.order_id)
      throw new Error("Payment session details are missing.");
    const result = await cashfree.checkout({
      paymentSessionId:data.payment_session_id,
      redirectTarget:"_self"
    });
    if(result && result.error)
      throw new Error(result.error.message || "Payment was not completed.");
  }catch(error){
    statusBox.textContent = error.message;
    button.disabled = false;
  }
});
</script>
</body>
</html>
